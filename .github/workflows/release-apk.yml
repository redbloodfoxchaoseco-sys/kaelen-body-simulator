name: Release APK

# Reconstruye el APK firmado cada vez que se publica un release.
# Requiere tres secretos en el repo (Settings > Secrets and variables > Actions):
#   KAELEN_KEYSTORE_B64 — kaelen-release.jks codificado en base64 (base64 -w0 kaelen-release.jks)
#   KAELEN_STORE_PASS   — contraseña del keystore
#   KAELEN_KEY_PASS     — contraseña de la clave (si difiere)
# Sin los secretos, el flujo construye un APK sin firmar y lo adjunta igualmente.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        env:
          KAELEN_KEYSTORE_B64: ${{ secrets.KAELEN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KAELEN_KEYSTORE_B64" ]; then
            echo "$KAELEN_KEYSTORE_B64" | base64 -d > android/kaelen-release.jks
            echo "keystore decodificado"
          else
            echo "::warning::Falta el secreto KAELEN_KEYSTORE_B64 — el APK saldrá sin firmar"
          fi

      - name: Sync web assets
        run: rsync -a --delete web/ android/app/src/main/assets/web/

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="manual-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          KAELEN_STORE_PASS: ${{ secrets.KAELEN_STORE_PASS }}
          KAELEN_KEY_PASS: ${{ secrets.KAELEN_KEY_PASS }}
          TAG: ${{ steps.ver.outputs.tag }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          [ -f android/kaelen-release.jks ] && [ -n "$KAELEN_STORE_PASS" ] \
            && echo "Construyendo APK firmado" \
            || echo "::warning::Sin keystore/contraseña — APK sin firmar"
          gradle -p android assembleRelease \
            -PAPP_VERSION="${TAG#v}" -PAPP_CODE="$CODE" --no-daemon

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -f android/kaelen-release.jks ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
            "$BT/apksigner" verify --print-certs "$APK" | head -5
          else
            echo "APK sin firmar — omisión de verificación"
          fi

      - name: Attach APK to release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Kaelen-BodySim-${TAG#v}.apk"
          gh release upload "$TAG" "Kaelen-BodySim-${TAG#v}.apk" --clobber
