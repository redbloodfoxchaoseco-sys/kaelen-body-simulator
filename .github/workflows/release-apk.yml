name: Release APK

# Reconstruye el APK firmado cada vez que se publica un release.
# Requiere tres secretos en el repo (Settings > Secrets and variables > Actions):
#   KAELEN_KEYSTORE_B64 — kaelen-release.jks codificado en base64 (base64 -w0 kaelen-release.jks)
#   KAELEN_STORE_PASS   — contraseña del keystore
#   KAELEN_KEY_PASS     — contraseña de la clave (si difiere)
# Sin los secretos, el flujo construye un APK sin firmar y NO lo adjunta al release.
# Tras configurar los secretos, re-ejecuta el flujo manualmente con la etiqueta
# del release para adjuntar el APK firmado.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta del release a reconstruir (ej. v1.1.0); vacío = solo compilar'
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        id: keystore
        env:
          KAELEN_KEYSTORE_B64: ${{ secrets.KAELEN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KAELEN_KEYSTORE_B64" ]; then
            echo "$KAELEN_KEYSTORE_B64" | base64 -d > android/kaelen-release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore decodificado — APK firmado"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secreto KAELEN_KEYSTORE_B64 — el APK saldrá sin firmar y no se adjuntará"
          fi

      - name: Sync web assets
        run: rsync -a --delete web/ android/app/src/main/assets/web/

      - name: Determine version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=""
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          KAELEN_STORE_PASS: ${{ secrets.KAELEN_STORE_PASS }}
          KAELEN_KEY_PASS: ${{ secrets.KAELEN_KEY_PASS }}
          TAG: ${{ steps.ver.outputs.tag }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          gradle -p android assembleRelease \
            -PAPP_VERSION="${TAG#v}" -PAPP_CODE="$CODE" --no-daemon

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -f android/kaelen-release.jks ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
            "$BT/apksigner" verify --print-certs "$APK" | head -5
          else
            echo "APK sin firmar — omisión de verificación"
          fi

      - name: Attach APK to release
        if: ${{ steps.keystore.outputs.signed == 'true' && steps.ver.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Kaelen-BodySim-${TAG#v}.apk"
          gh release upload "$TAG" "Kaelen-BodySim-${TAG#v}.apk" --clobber

      - name: Instructions when unsigned
        if: ${{ steps.keystore.outputs.signed != 'true' }}
        run: |
          echo "::notice::APK compilado sin firmar. Para adjuntar un APK firmado:"
          echo "::notice::1) Configura los secretos KAELEN_KEYSTORE_B64, KAELEN_STORE_PASS y KAELEN_KEY_PASS"
          echo "::notice::2) Re-ejecuta este flujo (Run workflow) con la etiqueta del release"
