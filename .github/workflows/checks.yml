name: Checks

# Validación de sintaxis JS en cada push a main y en cada PR.
# No reemplaza pruebas funcionales: solo detecta archivos rotos
# antes de que lleguen a un release.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax check
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if node --input-type=module --check < "$f" 2>/dev/null; then
              continue
            fi
            if node --check "$f" 2>/dev/null; then
              continue
            fi
            echo "::error file=$f::Sintaxis JS inválida"
            status=1
          done < <(find web anatomy3d desktop -name '*.js' -not -path '*/node_modules/*' -print0)
          exit $status
